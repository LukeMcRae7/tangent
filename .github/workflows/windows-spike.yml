# Stage 0's last open question: does the OpenCASCADE dependency work on Windows?
#
# Answered here rather than on a machine, because the answer has to keep being
# true. The spike is console-only -- no SDL, no GL -- so it isolates the one
# thing being asked about: whether OCCT builds through vcpkg with MSVC and
# whether our code compiles and runs against it.
#
# vcpkg builds OCCT from source, so the first run takes the best part of an
# hour. Later runs hit the binary cache and take minutes.
name: windows-spike

on:
  workflow_dispatch:
  push:
    branches: [spike/occt]
    paths: ['spike/**', '.github/workflows/windows-spike.yml']

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - uses: actions/checkout@v4

      # Lets vcpkg use the Actions cache for its built packages.
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        shell: pwsh
        run: |
          cmake -S spike -B spike/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build spike/build --config Release -j

      # The criterion is "a Windows build exists and runs", so it has to run.
      # naming returns non-zero if the mechanism leaks, which makes this a real
      # check rather than a smoke test.
      - name: Run
        shell: pwsh
        working-directory: spike/build
        run: |
          $exe = Get-ChildItem -Recurse -Filter occt_probe.exe | Select-Object -First 1
          $dir = $exe.Directory.FullName
          & "$dir/occt_probe.exe"
          & "$dir/naming.exe"
          if ($LASTEXITCODE -ne 0) { throw "naming reported the name map leaking" }
          & "$dir/compare.exe" bolt-circle
          & "$dir/tess2.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-binaries
          path: spike/build/**/*.exe
          if-no-files-found: warn
