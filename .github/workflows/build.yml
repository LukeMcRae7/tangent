# Build, test and package on every push; publish a release for a v* tag.
#
#   linux     Ubuntu 24.04. SDL3 and OpenCASCADE are built from source into
#             /opt/deps (24.04 has no SDL3 and an older OpenCASCADE than the
#             one tangent is written against), cached between runs. Unit
#             tests, the headless demo sweep, then an AppImage, which is
#             itself smoke-tested.
#   no-kernel The same, built without OpenCASCADE: meshes only.
#   windows   MSVC, with SDL3 and OpenCASCADE from vcpkg (vcpkg.json), its
#             built packages cached. Unit tests, then a portable zip with
#             every DLL and the C++ runtime beside the .exe.
#   release   Tags only: both packages attached to a GitHub release.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  SDL_TAG: release-3.4.16
  OCCT_TAG: V7_9_3

jobs:
  linux:
    name: linux / ${{ matrix.kernel && 'kernel' || 'no-kernel' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: [true, false]

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config libepoxy-dev zlib1g-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libglu1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev \
            xvfb imagemagick file

      # Restored and saved as separate steps: the save happens as soon as the
      # build does, so a job that fails later does not throw the build away.
      - name: Restore SDL3 and OpenCASCADE
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: /opt/deps
          key: deps-ubuntu24-${{ env.SDL_TAG }}-${{ env.OCCT_TAG }}-v1

      - name: Build SDL3 and OpenCASCADE
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/deps && sudo chown "$USER" /opt/deps
          git clone --depth 1 -b "$SDL_TAG" https://github.com/libsdl-org/SDL /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/deps -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL/build && cmake --install /tmp/SDL/build
          # Only what tangent links: the modelling and data exchange modules.
          git clone --depth 1 -b "$OCCT_TAG" https://github.com/Open-Cascade-SAS/OCCT /tmp/OCCT
          cmake -S /tmp/OCCT -B /tmp/OCCT/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/deps \
            -DBUILD_MODULE_Visualization=OFF -DBUILD_MODULE_ApplicationFramework=OFF \
            -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_DETools=OFF -DBUILD_DOC_Overview=OFF \
            -DUSE_FREETYPE=OFF -DUSE_TK=OFF -DUSE_TCL=OFF -DUSE_OPENGL=OFF -DUSE_XLIB=OFF
          cmake --build /tmp/OCCT/build && cmake --install /tmp/OCCT/build

      - name: Save SDL3 and OpenCASCADE
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The OpenCASCADE libraries load one another, and an executable's
      # RUNPATH covers only its own direct dependencies, so the prefix goes to
      # the loader itself.
      - name: Make the prefix's libraries loadable
        run: |
          echo /opt/deps/lib | sudo tee /etc/ld.so.conf.d/tangent-deps.conf
          sudo ldconfig

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/opt/deps
          -DCMAKE_BUILD_RPATH=/opt/deps/lib
          -DTANGENT_BREP=${{ matrix.kernel && 'ON' || 'OFF' }}

      - name: Build
        run: .github/build-annotated.sh

      - name: Test
        run: .github/test-annotated.sh

      # A gesture that segfaults or draws nothing still passes the unit tests.
      # These drive the application itself.
      - name: Demo sweep
        if: matrix.kernel
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./.github/sweep.sh 2>&1 | tee sweep.log && exit 0
          # Each failure and the lines it printed, as annotations.
          grep -A8 "FAIL" sweep.log | head -120 | awk -v RS="--\n" '{gsub(/%/,"%25"); gsub(/\n/,"%0A"); print "::error title=sweep::" $0}'
          exit 1

      - name: Package
        if: matrix.kernel
        run: packaging/package-linux.sh "${GITHUB_REF_NAME#v}" /opt/deps

      # The AppImage on its own, with /opt/deps out of reach: every library it
      # needs has to be inside it.
      - name: Smoke-test the AppImage
        if: matrix.kernel
        run: |
          sudo mv /opt/deps /opt/deps.hidden
          img=$(ls tangent-*.AppImage)
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a -s "-screen 0 1920x1080x24" ./"$img" --step-demo /tmp/smoke.step --smoke-test 2>&1) || true
          sudo mv /opt/deps.hidden /opt/deps
          echo "$out" | tail -20
          echo "$out" | grep -q "rendered cleanly"

      - uses: actions/upload-artifact@v4
        if: matrix.kernel
        with:
          name: linux
          path: tangent-*.AppImage
          if-no-files-found: error

  windows:
    name: windows / kernel
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      # vcpkg's built packages, kept between runs: OpenCASCADE takes an hour.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bin,readwrite
    steps:
      - uses: actions/checkout@v5

      # MSVC rather than MinGW: OpenCASCADE 7.9.3 built by MinGW's GCC 16
      # crashed inside Extrema_ExtCC in every boolean that classified a point
      # against a solid, whether MSYS2 built it or this job did.
      - uses: ilammy/msvc-dev-cmd@v1

      # The same commit as vcpkg.json's builtin-baseline, so the versions the
      # manifest names are the ones this vcpkg knows.
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '3723ec118c8354290925feb58d021a9205a3e772'

      - name: Restore vcpkg packages
        id: vcpkg-bin
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-bin
          key: vcpkg-bin-msvc-${{ hashFiles('vcpkg.json') }}-v1
          restore-keys: vcpkg-bin-msvc-

      - name: Configure
        # vcpkg installs the manifest's dependencies here.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Save vcpkg packages
        if: steps.vcpkg-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-bin
          key: ${{ steps.vcpkg-bin.outputs.cache-primary-key }}

      - name: Build
        run: .github/build-annotated.sh

      # Windows has no fork isolation, so a kernel fault that Linux survives is
      # fatal here. Running the tests is how that stops being a surprise.
      - name: Test
        run: .github/test-annotated.sh

      - name: Package
        run: packaging/package-windows.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: tangent ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          files: packages/*
          fail_on_unmatched_files: true
